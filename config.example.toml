# Copy to config.toml (gitignored) and edit.

[paths]
# Everything private lives here: PDFs, extracted text, SQLite DB, OAuth secrets.
# Relative paths are resolved against this file's directory.
data_dir = "data"

[gmail]
# Same syntax as the Gmail search box. Narrow it to your broker's sender address.
query = "from:(your-advisor@ndbs.lk) has:attachment filename:pdf"
# Only fetch mail on/after this date (YYYY-MM-DD). Empty = everything.
after = ""

[pdf]
# Passwords to try for encrypted statements. Can also be set via the
# SMPA_PDF_PASSWORDS env var (comma-separated).
passwords = []

[ocr]
# Broker PDFs are machine-generated, so their embedded text is exact and OCR isn't needed.
# "never": stop if a page has no text layer (default). "auto": OCR such pages. "always": OCR every page.
mode = "never"
language = "eng"
dpi = 300
# Tesseract page segmentation mode; 6 keeps table rows on one line.
psm = 6

[parser]
name = "ndb"
# Your broker account number. Documents for any other account stop the run.
account = ""
# Regexes for attachment file names to skip (e.g. research reports from the same sender).
# Anything not skipped and not recognised stops the run.
ignore_attachments = []
# Display label only.
currency = "LKR"
