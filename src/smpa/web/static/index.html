<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Monitor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
</head>
<body>
<main class="page">
  <header class="top" id="top"></header>

  <section class="controls" aria-label="Filters">
    <label class="field"><span>As of</span><input type="date" id="asof"></label>
    <label class="field grow"><span>Filter tables by symbol</span>
      <input type="search" id="filter" placeholder="e.g. JKH" autocomplete="off" spellcheck="false"></label>
  </section>

  <section class="readouts" id="readouts" aria-label="Totals"></section>

  <div class="row r32">
    <section class="panel">
      <div class="sec"><span class="n">01</span><span class="t">Holdings network</span><span class="r" id="net-note"></span></div>
      <div class="plot" id="network"></div>
    </section>
    <section class="panel">
      <div class="sec"><span class="n">02</span><span class="t">Position index</span><span class="r">Weight · unrealized</span></div>
      <div id="index"></div>
    </section>
  </div>

  <section class="panel">
    <div class="sec"><span class="n">03</span><span class="t">Value vs invested</span><span class="r" id="val-note"></span></div>
    <div class="legend wrap"><span class="item"><span class="key line"></span>Market value</span>
      <span class="item"><span class="key line grey"></span>Net invested</span>
      <span class="item"><span class="key line dash"></span>Same money in the ASPI</span>
      <span class="range" role="group" aria-label="Range"><button class="link" type="button" data-range="1y">1Y</button>
        <button class="link" type="button" data-range="all">All</button></span></div>
    <div class="plot" id="value"></div>
  </section>

  <div class="row r11">
    <section class="panel">
      <div class="sec"><span class="n">04</span><span class="t">Realized P&amp;L</span><span class="r" id="rea-note"></span></div>
      <div class="legend"><span class="key ink"></span>Gain<span class="key loss"></span>Loss</div>
      <div class="plot" id="realized-chart"></div>
    </section>
    <section class="panel">
      <div class="sec"><span class="n">05</span><span class="t">Turnover</span><span class="r" id="tur-note"></span></div>
      <div class="legend"><span class="key ink"></span>Buys<span class="key grey"></span>Sells</div>
      <div class="plot" id="turnover"></div>
    </section>
  </div>

  <details class="flags" id="flags"></details>

  <section class="records" aria-label="Records">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="table-wrap" id="table"></div>
    <div class="doc" id="doc" hidden><div class="sec"><span class="t" id="doc-title"></span>
      <button class="link" id="doc-close" type="button">Close</button></div><pre id="doc-text"></pre></div>
  </section>
</main>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
